<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود و ثبت نام - تسویه‌آب</title>
    <link rel="stylesheet" href="Tasfie-Ab.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <div class="site-name">تسویه‌آب</div>
    </header>
    
    <main>
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-tabs">
                    <div class="auth-tab active" data-tab="login">ورود</div>
                    <div class="auth-tab" data-tab="register">ثبت نام</div>
                </div>
                
                <div class="auth-form active" id="login-form">
                    <form>
                        <div class="form-group">
                            <label for="email">ایمیل یا نام کاربری</label>
                            <input type="text" id="email" class="form-control" placeholder="example@email.com" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="password">رمز عبور</label>
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        
                        <button type="submit" class="btn">ورود به حساب کاربری</button>
                        
                        <div class="auth-footer">
                            <a href="#">رمز عبور خود را فراموش کرده‌ام</a>
                        </div>
                        
                        <div class="social-login">
                            <button type="button" class="social-btn google">G</button>
                            <button type="button" class="social-btn facebook">f</button>
                            <button type="button" class="social-btn linkedin">in</button>
                        </div>
                    </form>
                </div>
                
                <div class="auth-form" id="register-form">
                    <form>
                        <div class="form-group">
                            <label for="name">نام و نام خانوادگی</label>
                            <input type="text" id="name" class="form-control" placeholder="علی محمدی" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email-reg">ایمیل</label>
                            <input type="email" id="email-reg" class="form-control" placeholder="example@email.com" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="password-reg">رمز عبور</label>
                            <input type="password" id="password-reg" class="form-control" placeholder="••••••••" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirm-password">تکرار رمز عبور</label>
                            <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required>
                        </div>
                        
                        <button type="submit" class="btn">ایجاد حساب کاربری</button>
                        
                        <div class="auth-footer">
                            <a href="#">قبلاً حساب کاربری دارم</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tabs = document.querySelectorAll('.auth-tab');
            const forms = document.querySelectorAll('.auth-form');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Remove active class from all tabs
                    tabs.forEach(t => t.classList.remove('active'));
                    // Add active class to clicked tab
                    tab.classList.add('active');
                    
                    // Hide all forms
                    forms.forEach(form => form.classList.remove('active'));
                    // Show corresponding form
                    const tabId = tab.getAttribute('data-tab');
                    document.getElementById(`${tabId}-form`).classList.add('active');
                });
            });
            
            // Add subtle animation on form load
            document.querySelectorAll('.auth-form').forEach(form => {
                form.addEventListener('animationend', () => {
                    form.style.opacity = '1';
                });
            });
        });
    </script>
</body>
</html>
